name: ci

# The same checks as `npm run verify`, on every pull request and on the production branch.
# Actions are pinned to a full commit. Checked 2026-11-17: checkout v7.0.1 (commit dated 2026-07-17),
# setup-node v7.1.0 (commit dated 2026-10-08).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      # Runs before any install: secrets, .npmrc rules, exact versions.
      - run: node scripts/check-repo.mjs
      # The kit has no dependencies yet. When it gets one, add `npm ci` here.
      - run: npm run verify
